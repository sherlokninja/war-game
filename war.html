<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WAR – Conquista Mundial</title>
<style>
:root{color-scheme:dark;--bg:#10151c;--pn:#1a222d;--tx:#e8edf3;--mu:#8b97a6;--ac:#e0b341;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;display:grid;grid-template-columns:230px 1fr 270px;grid-template-rows:auto 1fr 240px;height:100vh;overflow:hidden}
#top{grid-column:2;grid-row:1;text-align:center;padding:6px}
#ptag{display:inline-block;min-width:200px;padding:8px 28px;border-radius:8px;font-size:18px;font-weight:700;color:#111;box-shadow:0 2px 8px #0008}#ptag:empty{display:none}
#left,#right{background:var(--pn);padding:10px;box-sizing:border-box;overflow:auto;font-size:13px;grid-row:1/4}#left{grid-column:1}#right{grid-column:3;display:flex;flex-direction:column;gap:8px}
#act{flex:1;overflow:auto}#dicep{border-top:1px solid #3d4b5f;padding-top:6px;min-height:210px;text-align:center}
.mc{display:inline-block;background:#2b3747;border-radius:4px;padding:2px 6px;margin:2px;font-size:12px}h4{margin:12px 0 4px}
#bot{grid-column:2;grid-row:3;display:flex;gap:8px;padding:6px;box-sizing:border-box;height:240px;min-height:0}#blog{flex:1.3;overflow:auto;background:var(--pn);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--mu)}#chat{flex:1.3;display:flex;flex-direction:column;background:var(--pn);border-radius:8px;padding:6px;min-width:0}#cm{flex:1;overflow:auto;font-size:14px}#ci{flex:1;min-width:0;background:#10151c;color:var(--tx);border:1px solid #3d4b5f;border-radius:6px;padding:5px}
@media(max-width:900px){body{display:block;height:auto;overflow:auto}#bot{height:300px}}
#map{grid-column:2;grid-row:2;min-width:0;overflow:auto}#map svg{width:100%;height:auto;max-height:calc(100vh - 56px - 250px);display:block;background:#0b3a5c}
#side{display:none}
button,select{background:#2b3747;color:var(--tx);border:1px solid #3d4b5f;border-radius:6px;padding:7px 10px;cursor:pointer;margin:2px;font:inherit}
button.p{background:var(--ac);color:#111;font-weight:700}.sel{outline:3px solid var(--ac)}
.pl{display:flex;gap:6px;align-items:center;padding:3px 5px;border-radius:5px;font-size:12px}.pl.on{background:#2b3747;outline:1px solid var(--ac)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

.die{font-size:38px;line-height:1;margin:1px}.card{width:105px;height:90px;vertical-align:top;font-size:12px}.card b{font-size:26px}
text{pointer-events:none}
</style></head><body>
<div id="left"></div><div id="top"><span id="ptag"></span><span id="tmr" style="margin-left:12px;font-size:18px;font-weight:700"></span></div><div id="map"></div><div id="bot"><div id="blog"></div><div id="chat"><b>💬 Chat (abas locais)</b><div id="cm"></div><div style="display:flex"><input id="ci" placeholder="Mensagem…" maxlength="120"><button onclick="sendC()">➤</button></div></div></div>
<div id="right"><div id="cfg"></div><div id="act"></div><div id="dicep"><b>🎲 Dados</b><div id="db" style="color:var(--mu)">Aguardando ataque…</div></div></div><div id="side"></div>
<div id="md"><div class="box" id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),sl=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n);
const CN=['América do Norte','América do Sul','Europa','África','Ásia','Oceania'],CB=[5,2,5,3,7,2],CC=['#d98a3d','#5cc27c','#5b8fe0','#d9c040','#c96ba8','#45c1c1'];
const N='Alasca|Noroeste|Groenlândia|Alberta|Ontário|Quebec|Oeste EUA|Leste EUA|Am. Central|Venezuela|Peru|Brasil|Argentina|Islândia|Escandinávia|Grã-Bretanha|Europa Norte|Europa Ocid.|Europa Sul|Ucrânia|Norte África|Egito|África Orient.|Congo|África do Sul|Madagascar|Ural|Sibéria|Iakutsk|Kamchatka|Irkutsk|Mongólia|Japão|Afeganistão|China|Or. Médio|Índia|Sião|Indonésia|Nova Guiné|Austr. Ocid.|Austr. Orient.'.split('|');
const PS='70,80 170,75 330,50 150,135 230,140 310,140 140,205 235,215 160,285 220,350 215,430 300,400 240,500 400,95 490,85 410,165 490,170 420,235 515,235 590,135 450,330 535,310 575,390 520,420 530,490 620,490 670,130 740,90 820,70 910,80 800,140 810,200 920,200 660,205 780,265 610,285 700,320 790,335 800,420 900,410 810,500 910,500'.split(' ').map(s=>s.split(',').map(Number));
const E='0-1,0-3,0-29,1-2,1-3,1-4,2-4,2-5,2-13,3-4,3-6,4-5,4-6,4-7,5-7,6-7,6-8,7-8,8-9,9-10,9-11,10-11,10-12,11-12,11-20,13-14,13-15,14-15,14-16,14-19,15-16,15-17,16-17,16-18,16-19,17-18,17-20,18-19,18-20,18-21,18-35,19-26,19-33,19-35,20-21,20-22,20-23,21-22,21-35,22-23,22-24,22-25,22-35,23-24,24-25,26-27,26-33,26-34,27-28,27-30,27-31,27-34,28-29,28-30,29-30,29-31,29-32,30-31,31-32,31-34,33-34,33-35,33-36,34-36,34-37,35-36,36-37,37-38,38-39,38-40,39-40,39-41,40-41'.split(',').map(s=>s.split('-').map(Number));
const A=[...Array(42)].map(()=>[]);E.forEach(([a,b])=>{A[a].push(b);A[b].push(a)});
const CO=i=>i<9?0:i<13?1:i<20?2:i<26?3:i<38?4:5,CL=CN.map((_,c)=>[...Array(42).keys()].filter(j=>CO(j)==c));
const COL=['#e74c3c','#3498db','#2ecc71','#f1c40f','#b36bd6','#ff9f43'],CNM=['Vermelho','Azul','Verde','Amarelo','Roxo','Laranja'],SY=['▲','■','●'];
let G=null,step=1,AC,csel=[],hid=false,S={music:true,fx:true,speed:'slow'};
const cur=()=>G.pl[G.turn],own=i=>G.ter.map((x,j)=>x.o==i?j:-1).filter(j=>j>=0),troops=i=>own(i).reduce((s,j)=>s+G.ter[j].t,0),full=(i,c)=>CL[c].every(j=>G.ter[j].o==i),lg=m=>{G.log.unshift(m);G.log.length=Math.min(G.log.length,40)};
const modal=h=>{$('#mb').innerHTML=h;$('#md').style.display='flex'},closeM=()=>$('#md').style.display='none',setStep=k=>{step=k;render()};
/* ---------- som ---------- */
function tone(f,t,d,ty,v,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
function snd(k){try{AC=AC||new AudioContext();AC.resume();const t=AC.currentTime;
if(k=='shot'){const n=AC.sampleRate*.3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=.6;s.buffer=b;s.connect(g).connect(AC.destination);s.start(t);tone(120,t,.15,'sine',.5,40)}
else if(k=='def'){tone(1200,t,.25,'triangle',.4,700);tone(1800,t,.15,'square',.1,900)}
else if(k=='tick')tone(500,t,.04,'square',.05);
else [523,659,784,1047].forEach((f,i)=>tone(f,t+i*.13,.3,'triangle',.25))}catch(e){}}
/* ---------- início ---------- */
function setup(){modal('<h2>⚔ WAR – Conquista Mundial</h2><p>Jogadores: <select id="np" onchange="setup2()">'+[3,4,5,6].map(n=>`<option ${n==4?'selected':''}>${n}</option>`).join('')+'</select></p><div id="sl"></div><button class="p" onclick="start()">Iniciar partida</button>');setup2()}
function setup2(){const n=+$('#np').value;$('#sl').innerHTML=[...Array(n)].map((_,i)=>`<p><span class="dot" style="background:${COL[i]}"></span> <input id="n${i}" placeholder="${CNM[i]}" size="9" maxlength="12"> <select id="b${i}"><option value="0">Humano</option><option value="1">Bot Fácil</option><option value="2" ${i?'selected':''}>Bot Médio</option><option value="3">Bot Difícil</option></select></p>`).join('')}
function start(){const n=+$('#np').value;G={pl:[],ter:[...Array(42)].map(()=>({o:-1,t:0})),turn:0,phase:'claim',left:0,trades:0,conqd:false,sel:null,mv:[],elim:{},deck:[],lock:false,busy:false,over:false,log:[]};
for(let i=0;i<n;i++)G.pl.push({n:($('#n'+i).value.replace(/[<>&"]/g,'').trim()||CNM[i]),c:COL[i],bot:+$('#b'+i).value,alive:true,cards:[]});
for(let i=0;i<42;i++)G.deck.push({s:i%3,t:i});G.deck.push({s:3,t:-1},{s:3,t:-1});
let pool=[];for(let i=0;i<n;i++)pool.push({k:'d',p:i});[[4,1],[4,3],[0,3],[0,5],[2,1,1],[2,5,1]].forEach(a=>pool.push({k:'c',c:[a[0],a[1]],x:a[2]}));pool.push({k:'t18'},{k:'t24'});
G.pl.forEach((p,i)=>{const ok=pool.filter(o=>!(o.k=='d'&&o.p==i)),o=ok[rnd(ok.length)];pool.splice(pool.indexOf(o),1);p.obj=o});
music();snd('tick');closeM();lg('Distribuição: cada jogador ocupa um território cinza com 2 soldados.');loop()}
const objText=o=>o.k=='d'?`Eliminar o jogador ${G.pl[o.p].n}`:o.k=='c'?`Conquistar ${CN[o.c[0]]} e ${CN[o.c[1]]}${o.x?' e mais 1 continente à escolha':''}`:o.k=='t18'?'Conquistar 18 territórios com pelo menos 2 soldados em cada':'Conquistar 24 territórios';
function done(i){const o=G.pl[i].obj,m=own(i);if(o.k=='d')return!G.pl[o.p].alive&&G.elim[o.p]==i;if(o.k=='t18')return m.filter(j=>G.ter[j].t>=2).length>=18;if(o.k=='t24')return m.length>=24;const f=CN.map((_,c)=>full(i,c));return o.c.every(c=>f[c])&&(!o.x||f.filter(x=>x).length>2)}
function win(i){G.over=true;snd('win');const p=G.pl[i];modal(`<h2>🏆 <span style="color:${p.c}">${p.n}</span> venceu!</h2><p>${p.obj&&done(i)?'Objetivo cumprido: '+objText(p.obj):'Último jogador restante.'}</p><button class="p" onclick="backLobby()">Voltar ao lobby</button>`);render()}
const objM=()=>modal(`<h3>🎯 Carta-Objetivo</h3><div style="border:2px solid ${cur().c};border-radius:10px;padding:18px;max-width:320px;background:#232d3b"><b style="color:${cur().c}">${cur().n}</b><p style="font-size:16px">${objText(cur().obj)}</p></div><p style="color:var(--mu)">Mantenha em segredo!</p><button class="p" onclick="closeM()">Entendi</button>`);
/* ---------- turnos ---------- */
function adv(){do{G.turn=(G.turn+1)%G.pl.length}while(!cur().alive)}
function loop(){render();if(!G||G.over)return;if(cur().bot&&!G.busy){G.busy=true;setTimeout(botTurn,500)}}
function claim(i){G.ter[i]={o:G.turn,t:2};lg(`${cur().n} ocupou ${N[i]}`);snd('def');if(G.ter.every(x=>x.o>=0)){G.turn=0;beginTurn()}else adv();loop()}
function beginTurn(){G.phase='reinforce';G.conqd=false;G.sel=null;G.left=Math.max(3,Math.floor(own(G.turn).length/2))+CN.reduce((s,_,c)=>s+(full(G.turn,c)?CB[c]:0),0);lg(`— Turno de ${cur().n}: ${G.left} tropas (território + continentes) —`)}
function endTurn(){const p=cur();if(G.conqd&&p.cards.length<5&&G.deck.length){p.cards.push(G.deck.splice(rnd(G.deck.length),1)[0]);lg(`${p.n} ganhou uma carta`)}adv();beginTurn();loop()}
function nextPhase(){if(cur().bot||G.lock)return;if(G.phase=='reinforce'){if(G.left+G.cb.reduce((a,b)=>a+b,0)>0)return alert('Distribua todas as tropas (o bônus de continente só vale no continente de origem).');if(cur().cards.length>=5&&findSet(cur().cards))return alert('Com 5 cartas você deve trocar.');G.phase='attack';G.sel=null}else if(G.phase=='attack'){G.phase='move';G.sel=null;G.mv=G.ter.map((t,i)=>t.o==G.turn?t.t-1:0)}else if(G.phase=='move')return endTurn();render()}
/* ---------- cartas ---------- */
const okSet=a=>{const n=a.filter(c=>c.s<3).map(c=>c.s),z=new Set(n).size;return a.length==3&&(z<=1||z==n.length)};
function findSet(cs){for(let a=0;a<cs.length;a++)for(let b=a+1;b<cs.length;b++)for(let c=b+1;c<cs.length;c++)if(okSet([cs[a],cs[b],cs[c]]))return[a,b,c];return null}
function trade(pi,idx){const p=G.pl[pi],cs=idx.map(i=>p.cards[i]),k=G.trades++,b=k<5?4+2*k:15+5*(k-5);G.left+=b;let ex=0;cs.forEach(c=>{if(c.t>=0&&G.ter[c.t].o==pi){G.ter[c.t].t+=2;ex+=2}});p.cards=p.cards.filter((_,i)=>!idx.includes(i));G.deck.push(...cs);lg(`${p.n} trocou cartas: +${b} tropas${ex?` e +${ex} nos países das cartas`:''}`);snd('win')}
function cardsM(){const p=cur();modal(`<h3>Cartas (${p.cards.length}/5)</h3><p style="color:var(--mu);max-width:420px">Troque 3 do mesmo símbolo (coringa vale qualquer um, sem bônus de país). Carta de país seu: +2 tropas nele. Cartas só são ganhas ao conquistar um território no turno.</p>`+p.cards.map((c,i)=>`<button class="card ${csel.includes(i)?'sel':''}" onclick="pick(${i})"><b>${c.s<3?SY[c.s]:'▲■●'}</b><br>${c.t>=0?N[c.t]+(G.ter[c.t].o==G.turn?' (+2)':''):'Coringa'}</button>`).join('')+'<p><button class="p" onclick="doTrade()">Trocar selecionadas</button><button onclick="closeM()">Fechar</button></p>')}
function pick(i){csel.includes(i)?csel=csel.filter(x=>x!=i):csel.length<3&&csel.push(i);cardsM()}
function doTrade(){const p=cur();if(G.phase!='reinforce')return alert('Troque cartas na fase de reforço.');if(!okSet(csel.map(i=>p.cards[i])))return alert('Escolha 3 cartas do mesmo símbolo.');trade(G.turn,csel);csel=[];cardsM();render()}
/* ---------- combate ---------- */
async function rollUI(ra,rd,la,ld,bot){const el=$('#dice'),box=$('#db'),fc=v=>'⚀⚁⚂⚃⚄⚅'[v-1],row=(A,c)=>`<div style="color:${c}">${A.map(v=>`<span class="die">${fc(v)}</span>`).join('')}</div>`;
const draw=(a,d,r)=>box.innerHTML=`<div>ATAQUE</div>${row(a,'#ff6b6b')}<div>DEFESA</div>${row(d,'#6bb5ff')}${r||''}`;el.style.display='flex';
for(let i=0;i<(bot?4:7);i++){draw(ra.map(()=>1+rnd(6)),rd.map(()=>1+rnd(6)));snd('tick');await sl(90)}
draw(ra,rd,`<p><b>Atacante perde ${la} · Defensor perde ${ld}</b></p>`);if(ld)snd('shot');if(la)setTimeout(()=>snd('def'),250);await sl(bot?650:1500);el.style.display='none'}
let askMove=(mn,mx)=>new Promise(r=>{modal(`<h3>Território conquistado!</h3><p>Mover quantos soldados?</p><input type="range" id="rg" min="${mn}" max="${mx}" value="${mn}" oninput="rv.textContent=this.value"> <b id="rv">${mn}</b><p><button class="p" id="okm">Mover</button></p>`);$('#okm').onclick=()=>{const v=+$('#rg').value;closeM();r(v)}});
async function attack(f,t){G.lock=true;const F=G.ter[f],D=G.ter[t],me=G.turn,P=cur(),a=Math.min(3,F.t-1),d=Math.min(3,D.t),r=n=>[...Array(n)].map(()=>1+rnd(6)).sort((x,y)=>y-x),ra=r(a),rd=r(d);let la=0,ld=0;
for(let i=0;i<Math.min(a,d);i++)ra[i]>rd[i]?ld++:la++;
await rollUI(ra,rd,la,ld,P.bot);F.t-=la;D.t-=ld;lg(`${P.n} atacou ${N[t]} (${G.pl[D.o].n}) de ${N[f]}: 🎲 ${ra.join(' ')} × ${rd.join(' ')} → perdas ${la} x ${ld}`);
if(D.t<=0){const def=D.o,mn=a,mx=F.t-1;let m=mn;if(!P.bot&&mx>mn)m=await askMove(mn,mx);else if(P.bot==3&&mx>mn)m=Math.ceil((mn+mx)/2);
F.t-=m;D.o=me;D.t=m;G.conqd=true;snd('win');lg(`${P.n} conquistou ${N[t]}!`);
if(!own(def).length){const Q=G.pl[def];Q.alive=false;G.elim[def]=me;await takeCards(Q,P);lg(`💀 ${Q.n} foi eliminado por ${P.n}`);
G.pl.forEach((q,i)=>{if(q.alive&&q.obj.k=='d'&&q.obj.p==def&&i!=me)q.obj={k:'t24'}})}
if(done(me)||G.pl.filter(x=>x.alive).length==1)win(me)}
G.lock=false;render()}
/* ---------- humano ---------- */
function clickT(i){if(!G||G.over||G.lock||G.busy||cur().bot)return;const T=G.ter[i],me=G.turn;
if(G.phase=='claim'){if(T.o<0)claim(i);return}
if(G.phase=='reinforce'){if(T.o!=me)return;const c=CO(i);let k=Math.min(step,G.cb[c]);if(k>0)G.cb[c]-=k;else{k=Math.min(step,G.left);G.left-=k}if(k>0){T.t+=k;snd('tick');if(G.left+G.cb.reduce((a,b)=>a+b,0)==0&&!findSet(cur().cards)){G.phase='attack';G.sel=null;dlset()}render()}return}
if(G.phase=='attack'){if(T.o==me){G.sel=T.t>1?i:null;render()}else if(G.sel!=null&&A[G.sel].includes(i))attack(G.sel,i).then(()=>{if(G.sel!=null&&(G.ter[G.sel].o!=me||G.ter[G.sel].t<2))G.sel=null;render()});else if(G.sel!=null){G.sel=null;render()}return}
if(G.phase=='move'){if(T.o!=me){G.sel=null;render();return}if(G.sel==null||G.sel==i)G.sel=G.sel==i?null:i;else if(!A[G.sel].includes(i))G.sel=i;else if(G.mv[G.sel]>0){const k=Math.min(step,G.mv[G.sel]);G.mv[G.sel]-=k;G.ter[G.sel].t-=k;T.t+=k}render()}}
/* ---------- bots ---------- */
async function botTurn(){const p=cur(),L=p.bot,me=G.turn,thr=i=>A[i].filter(j=>G.ter[j].o!=me).reduce((s,j)=>s+G.ter[j].t,0),objC=i=>p.obj.k=='c'&&p.obj.c.includes(CO(i));
if(G.phase=='claim'){let best=-1,bs=-1e9;[...G.ter.keys()].filter(i=>G.ter[i].o<0).forEach(i=>{let s=Math.random()*3;if(L>1)s+=CL[CO(i)].filter(j=>G.ter[j].o==me).length*3+A[i].filter(j=>G.ter[j].o==me).length;if(L>2&&objC(i))s+=5;if(s>bs){bs=s;best=i}});G.busy=false;claim(best);return}
await sl(300);let ts;while((ts=findSet(p.cards)))trade(me,ts);
const mine=own(me);while(G.left>0||G.cb.some(x=>x>0)){const ci=G.cb.findIndex(x=>x>0),base=ci>=0?mine.filter(i=>CO(i)==ci):mine;let k;if(L==1)k=base[rnd(base.length)];else{const c=base.filter(i=>thr(i)>0),pl=c.length?c:base;k=pl.map(i=>[i,thr(i)+(L>2&&objC(i)?5:0)+Math.random()*(L==2?10:4)]).sort((a,b)=>b[1]-a[1])[0][0]}G.ter[k].t++;if(ci>=0)G.cb[ci]--;else G.left--}
snd('tick');G.phase='attack';render();await sl(600);
const lim=[0,4,10,25][L];let n=0;
while(n++<lim&&!G.over){let best=null,bs=-1e9;for(const f of own(me)){const F=G.ter[f];if(F.t<2)continue;for(const t of A[f]){const D=G.ter[t];if(D.o==me)continue;const ad=F.t-1-D.t;if(L==1&&(ad<-2||Math.random()>.6))continue;if(L==2&&ad<0)continue;if(L==3&&!(ad>=1||(ad>=0&&F.t>=6)))continue;
